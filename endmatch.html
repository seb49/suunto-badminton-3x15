


    <uiView>    
  <div id="suuntoplus">
    <div class="sp-title-bg" style="width:100%;height:15%;"></div>
    <div class="sp-title-text sp-t-m p-hc" style="top:3%;">Bad 3x15</div>
    

  

    <div class="cm-bg sp-vertical-center p-hc" style="top:20%">
      <span class="sp-t-m">End match</span>            
    </div>

    <div class="cm-bg sp-vertical-center p-hc" style="top:30%">
      <span class="sp-t-m">Winner</span>      
    </div>

<!-- INDICATEURS descendus a 70% pour eviter superposition avec les scores -->
    <div class="cm-mid" style="top:64%;left:calc(50% - 1px);width:4px;height:33%;">|</div>     
    <div class="sp-c-orange sp-t-s" style="top:45%;left:5%;width:46%;text-align:center;">1st</div>
    <div class="sp-c-orange sp-t-s" style="top:45%;left:16%;width:46%;text-align:center;">
      <eval input="Zapp/{zapp_index}/Output/set1Home" outputFormat="Count_Twodigits" default="-" />
    </div>
    <div class="sp-c-orange sp-t-s" style="top:45%;left:40%;width:46%;text-align:center;">
      <eval input="Zapp/{zapp_index}/Output/set1Away" outputFormat="Count_Twodigits" default="-" />
    </div>

    <!-- INDICATEURS descendus a 70% pour eviter superposition avec les scores -->
    <div class="cm-mid" style="top:70%;left:calc(50% - 1px);width:4px;height:33%;">|</div>     
    <div class="sp-c-orange sp-t-s" style="top:55%;left:5%;width:46%;text-align:center;">2nd</div>
    <div class="sp-c-orange sp-t-s" style="top:55%;left:16%;width:46%;text-align:center;">
      <eval input="Zapp/{zapp_index}/Output/set2Home" outputFormat="Count_Twodigits" default="-" />
    </div>
    <div class="sp-c-orange sp-t-s" style="top:55%;left:40%;width:46%;text-align:center;">
      <eval input="Zapp/{zapp_index}/Output/set2Away" outputFormat="Count_Twodigits" default="-" />
    </div>
    <!-- INDICATEURS descendus a 70% pour eviter superposition avec les scores -->
    <div class="cm-mid" style="top:70%;left:calc(50% - 1px);width:4px;height:33%;">|</div>     
    <div class="sp-c-orange sp-t-s" style="top:65%;left:5%;width:46%;text-align:center;">3rd</div>
    <div class="sp-c-orange sp-t-s" style="top:65%;left:16%;width:46%;text-align:center;">
      <eval input="Zapp/{zapp_index}/Output/set3Home" outputFormat="Count_Twodigits" default="-" />
    </div>
    <div class="sp-c-orange sp-t-s" style="top:65%;left:40%;width:46%;text-align:center;">
      <eval input="Zapp/{zapp_index}/Output/set3Away" outputFormat="Count_Twodigits" default="-" />
    </div>

    <!-- Bottom button hint image -->
    <:if test="{{ IS_NG3 }}">
      <!-- New watches -->
      <div class="btn btn-btm">
        <img class="cm-bgc icon" src="hint-btn-bottom.png" />
      </div>
    </:if>
    <:else>
      <!-- Old watches -->
      <img class="btn-btmMask" src="a-sel-d.png" />
    </:else>
<div style="left:5%; top:76%; width:90%; height:25%; background-color:#FFB000; text-align:center;">
    <span class="sp-t-m sp-vertical-center" style="color:white;">
        END / CANCEL
    </span>
</div>

  </div>
      <!-- Button handlers trigger onEvent callback in main.js -->
     <userInput>      
      <pushButton name="down" onClick="$.put('/Zapp/{zapp_index}/Event', 9, null, 'int32');" 
      onLongPress="$.put('/Zapp/{zapp_index}/Event', 10, null, 'int32');"/>
    </userInput>

</uiView>
