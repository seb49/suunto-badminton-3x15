<uiView>    
  <div id="suuntoplus">
    <div class="sp-title-bg" style="width:100%;height:15%;"></div>
    <div class="sp-title-text sp-t-m p-hc" style="top:3%;">Bad 3x15</div>
    
    <div class="cm-bg sp-vertical-center p-hc" style="top:25%">
      <span class="sp-t-m">End match</span>            
    </div>

    
 <!--Barre verticale de séparation-->
    <div style="
    left:50%;
    top:40%;
    width:2px;
    height:30%;
    background-color:white;
"></div>
<!-- INDICATEURS descendus a 70% pour eviter superposition avec les scores -->
    <div class="sp-c-orange sp-t-s" style="top:40%;left:5%;width:46%;text-align:center;">1st</div>
    <div class="sp-c-orange sp-t-s" style="top:40%;left:18%;width:46%;text-align:center;">
      <eval input="Zapp/{zapp_index}/Output/set1Home" outputFormat="Count_Twodigits" default="-" />
    </div>
    <div class="sp-c-orange sp-t-s" style="top:40%;left:38%;width:46%;text-align:center;">
      <eval input="Zapp/{zapp_index}/Output/set1Away" outputFormat="Count_Twodigits" default="-" />
    </div>

    <!-- INDICATEURS descendus a 70% pour eviter superposition avec les scores -->
    <div class="sp-c-orange sp-t-s" style="top:50%;left:5%;width:46%;text-align:center;">2nd</div>
    <div class="sp-c-orange sp-t-s" style="top:50%;left:18%;width:46%;text-align:center;">
      <eval input="Zapp/{zapp_index}/Output/set2Home" outputFormat="Count_Twodigits" default="-" />
    </div>
    <div class="sp-c-orange sp-t-s" style="top:50%;left:38%;width:46%;text-align:center;">
      <eval input="Zapp/{zapp_index}/Output/set2Away" outputFormat="Count_Twodigits" default="-" />
    </div>
    <!-- INDICATEURS descendus a 70% pour eviter superposition avec les scores -->
    <div class="sp-c-orange sp-t-s" style="top:60%;left:5%;width:46%;text-align:center;">3rd</div>
    <div class="sp-c-orange sp-t-s" style="top:60%;left:18%;width:46%;text-align:center;">
      <eval input="Zapp/{zapp_index}/Output/set3Home" outputFormat="Count_Twodigits" default="-" />
    </div>
    <div class="sp-c-orange sp-t-s" style="top:60%;left:38%;width:46%;text-align:center;">
      <eval input="Zapp/{zapp_index}/Output/set3Away" outputFormat="Count_Twodigits" default="-" />
    </div>


  <div style="width: 100%; height: 50%; top: calc(100% - 50%e); left: 0%;">
      <img src="btn-shape-btm.png" class="c-grey" />
      <div class="f-t-l cm-fgc" style="top: 0%; left: calc(50% - 50%e);">Cancel last win</div>
    </div>
    <div style="width: 50px; height: 50px; top: calc(72.5% - 50%e); left: calc(90% - 50%e);">
      <img class="c-white" src="hint-btn-bottom.png" />
    </div>

  </div>
      <!-- Button handlers trigger onEvent callback in main.js -->
     <userInput>
      <pushButton name="up" onClick="return;"  />      
      <pushButton name="down" onClick="$.put('/Zapp/{zapp_index}/Event', 10, null, 'int32');"  />
    </userInput>

</uiView>
