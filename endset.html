<uiView
onActivate="$.subscribe('Zapp/{zapp_index}/Output/currentSet', function(v) {
      setText('#some_id', 'Game ' + v);
    });">
    <div id="suuntoplus">
     <div style="width: 100%; height: 50%; top: 0%; left: 0%;">
      <img src="btn-shape-top.png" class="c-yellow" />
      <div class="f-t-l cm-fgc" style="top: calc(30% - 50%e); left: calc(50% - 50%e);">Continue</div>
    </div>
    <div style="width: 50px; height: 50px; top: calc(35% - 50%e); left: calc(90% - 50%e);">
      <img class="c-lime" src="hint-btn-top.png" />
    </div>
    
   <div  class="cm-bg sp-vertical-center p-hc" style="top:35%;left: calc(50% - 50%e);">
       <span id="some_id" class="sp-t-l">SET 2</span>   
   </div>   


   
   <div  class="cm-bg sp-vertical-center p-hc" style="top:50%;left: calc(50% - 50%e);">
   
      <span class="sp-t-l"><eval input="Zapp/{zapp_index}/Output/homeScore"
        outputFormat="Count_Threedigits" default="10"/></span>
        <span class="sp-t-l"> - </span> 
      <span class="sp-t-l"><eval input="Zapp/{zapp_index}/Output/awayScore"
        outputFormat="Count_Threedigits" default="15"/></span>           
    </div>

  <div style="width: 100%; height: 50%; top: calc(100% - 50%e); left: 0%;">
      <img src="btn-shape-btm.png" class="c-grey" />
      <div class="sp-t-m cm-fgc" style="top: calc(20% - 50%e); left: calc(50% - 50%e);">CANCEL LAST WIN</div>
    </div>
    <div style="width: 50px; height: 50px; top: calc(72.5% - 50%e); left: calc(90% - 50%e);">
      <img class="c-white" src="hint-btn-bottom.png" />
    </div>
    <!-- Button handlers trigger onEvent callback in main.js -->
    <userInput>      
      <pushButton name="up" onClick="$.put('/Zapp/{zapp_index}/Event', 9, null, 'int32');"/>
      <pushButton name="down" onClick="$.put('/Zapp/{zapp_index}/Event', 10, null, 'int32');"/>
    </userInput>
  </div>

  
  </uiView>
